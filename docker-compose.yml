services:
  eqkanshi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eqkanshi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||'3000')+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
